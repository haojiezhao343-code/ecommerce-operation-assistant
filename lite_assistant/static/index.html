<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商运营助手 · 数据智能平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<script src="/echarts.min.js"></script>
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --bg:#f5f7fa; --card:#ffffff;
  --text:#1f2937; --text-sub:#6b7280; --border:#e5e7eb; --up:#dc2626; --down:#16a34a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
/* 顶部栏 */
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#3b82f6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.topbar h1{font-size:17px;font-weight:600}
.topbar .sub{color:var(--text-sub);font-size:12px;margin-left:8px;padding-left:12px;border-left:1px solid var(--border)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-sub)}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:5px}
/* 布局 */
.wrap{max-width:1440px;margin:0 auto;padding:20px 24px 32px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.kpi .label{color:var(--text-sub);font-size:12px;margin-bottom:8px}
.kpi .value{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .delta{font-size:12px;margin-top:6px}
.kpi .delta.up{color:var(--up)} .kpi .delta.down{color:var(--down)}
.kpi .delta .ref{color:var(--text-sub)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:11px;font-weight:400;color:var(--text-sub)}
.chart{width:100%;height:280px}
.chart-sm{width:100%;height:280px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--text-sub);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--border);font-size:12px}
td{padding:9px 6px;border-bottom:1px solid #f3f4f6}
tr:last-child td{border-bottom:none}
.rank{display:inline-block;width:20px;height:20px;border-radius:6px;background:#f1f5f9;color:#64748b;text-align:center;line-height:20px;font-size:11px;margin-right:6px}
.rank.r1{background:#fef2f2;color:#dc2626}.rank.r2{background:#fff7ed;color:#ea580c}.rank.r3{background:#fefce8;color:#ca8a04}
.cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
/* AI 面板 */
.ai{display:grid;grid-template-columns:1fr;gap:0;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:16px}
.ai-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.ai-header .avatar{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.ai-header b{font-size:14px}
.ai-header span{font-size:12px;color:var(--text-sub)}
.chat-box{height:380px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:#fafbfc}
.msg{max-width:78%;line-height:1.7;white-space:pre-wrap;word-break:break-word;border-radius:10px;padding:10px 14px;font-size:13.5px}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:2px}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:2px}
.msg.bot.error{color:var(--up);border-color:#fecaca;background:#fef2f2}
.msg.bot b{color:var(--primary-dark)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px 0}
.chip{font-size:12px;color:var(--primary);background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:5px 12px;cursor:pointer;transition:.15s}
.chip:hover{background:#dbeafe}
.input-row{display:flex;gap:10px;padding:14px 20px}
.input-row input{flex:1;border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-size:13.5px;outline:none;font-family:inherit}
.input-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.input-row button{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:0 26px;font-size:13.5px;cursor:pointer;font-family:inherit}
.input-row button:hover{background:var(--primary-dark)}
.input-row button:disabled{background:#93c5fd;cursor:not-allowed}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:#9ca3af;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (max-width:1024px){.kpis{grid-template-columns:repeat(2,1fr)}.grid,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">🛒</div>
  <h1>电商运营助手</h1>
  <span class="sub">数据智能平台 · AI 驱动的经营分析</span>
  <div class="right"><span><i class="dot"></i>数据实时在线</span><span id="today"></span></div>
</div>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card"><h3>GMV 与订单趋势 <span class="tag">近 30 天</span></h3><div id="c-trend" class="chart"></div></div>
    <div class="card"><h3>品类销售结构 <span class="tag">近 30 天 GMV</span></h3><div id="c-cat" class="chart"></div></div>
  </div>

  <div class="grid2">
    <div class="card"><h3>支付转化漏斗 <span class="tag">近 30 天</span></h3><div id="c-funnel" class="chart-sm"></div></div>
    <div class="card"><h3>地区销售分布 <span class="tag">近 30 天 GMV</span></h3><div id="c-region" class="chart-sm"></div></div>
    <div class="card"><h3>热销商品 TOP10 <span class="tag">按 GMV</span></h3>
      <table id="top-table"></table>
    </div>
  </div>

  <div class="ai">
    <div class="ai-header"><div class="avatar">✦</div><div><b>AI 运营分析师</b><br><span>基于店铺真实数据问答，支持经营诊断与建议</span></div></div>
    <div class="chat-box" id="chat"></div>
    <div class="chips">
      <span class="chip">今天的 GMV 和订单情况怎么样？</span>
      <span class="chip">近30天哪个品类卖得最好？</span>
      <span class="chip">热销榜第一的商品经营状况如何？</span>
      <span class="chip">转化漏斗哪一环流失最严重，怎么优化？</span>
      <span class="chip">给我一份明天的运营重点建议</span>
    </div>
    <div class="input-row">
      <input id="q" placeholder="输入问题，例如：昨天销售额多少？哪个商品需要补货？" maxlength="200">
      <button id="send">发送</button>
    </div>
  </div>
</div>

<script>
const fmt = n => n >= 100000000 ? (n/1e8).toFixed(2)+'亿' : n >= 10000 ? (n/1e4).toFixed(1)+'万' : n.toLocaleString();
const fmtR = n => '¥' + fmt(n);
const arrow = v => (v >= 0 ? '↑' : '↓') + Math.abs(v) + '%';
const COLORS = ['#2563eb','#7c3aed','#0ea5e9','#10b981','#f59e0b','#ef4444','#64748b'];

document.getElementById('today').textContent = new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});

fetch('/api/dashboard').then(r=>r.json()).then(D=>{
  const K = D.kpi;
  document.getElementById('kpis').innerHTML = [
    ['今日 GMV', fmtR(K.gmv), K.gmv_huan, '较昨日'],
    ['今日订单', K.orders.toLocaleString()+' 单', K.orders_huan, '较昨日'],
    ['客单价', '¥'+K.aov, K.conv_huan, '转化率 '+K.conv+'%'],
    ['退款率', K.refund_rate+'%', K.refund_huan, '较昨日'],
  ].map(([l,v,d,ref])=>{
    const cls = l==='退款率' ? (d>0?'down':'up') : (d>=0?'up':'down');
    return `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div>
      <div class="delta ${cls}">${arrow(d)} <span class="ref">${ref}</span></div></div>`;
  }).join('');

  const dark = '#1f2937', sub = '#6b7280';
  // 趋势双轴
  echarts.init(document.getElementById('c-trend')).setOption({
    color:['#2563eb','#10b981'],
    tooltip:{trigger:'axis'},
    legend:{data:['GMV','订单数'],top:0,right:0,textStyle:{color:sub,fontSize:12}},
    grid:{left:10,right:10,top:34,bottom:0,containLabel:true},
    xAxis:{type:'category',data:D.trend.map(t=>t.date),axisLine:{lineStyle:{color:'#e5e7eb'}},axisLabel:{color:sub}},
    yAxis:[{type:'value',name:'GMV(元)',splitLine:{lineStyle:{color:'#f3f4f6'}},axisLabel:{color:sub,formatter:fmt}},
           {type:'value',name:'订单',splitLine:{show:false},axisLabel:{color:sub}}],
    series:[{name:'GMV',type:'line',smooth:true,showSymbol:false,data:D.trend.map(t=>t.gmv),areaStyle:{color:'rgba(37,99,235,.08)'},lineStyle:{width:2.5}},
            {name:'订单数',type:'line',yAxisIndex:1,smooth:true,showSymbol:false,data:D.trend.map(t=>t.orders),lineStyle:{width:2}}]
  });
  // 品类饼图
  const catData = Object.entries(D.category).map(([name,value],i)=>({name,value,itemStyle:{color:COLORS[i%COLORS.length]}}));
  echarts.init(document.getElementById('c-cat')).setOption({
    tooltip:{trigger:'item',formatter:'{b}<br>{c}元（{d}%）'},
    legend:{orient:'vertical',right:0,top:'center',textStyle:{color:sub,fontSize:12},itemWidth:10,itemHeight:10},
    series:[{type:'pie',radius:['48%','72%'],center:['38%','50%'],data:catData,label:{show:false},
      emphasis:{label:{show:false}},itemStyle:{borderColor:'#fff',borderWidth:2}}],
    graphic:[{type:'text',left:'31%',top:'48%',style:{text:'近30天\n总GMV',textAlign:'center',fill:sub,fontSize:12,lineHeight:18}}]
  });
  // 漏斗
  echarts.init(document.getElementById('c-funnel')).setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c}'},
    series:[{type:'funnel',left:'8%',width:'84%',top:10,bottom:10,minSize:'22%',sort:'descending',gap:2,
      label:{position:'inside',formatter:'{b}  {c}',color:'#fff',fontSize:12},
      data:Object.entries(D.funnel).map(([name,value],i)=>({name,value,itemStyle:{color:COLORS[i],opacity:.92}}))}]
  });
  // 地区
  echarts.init(document.getElementById('c-region')).setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>p[0].name+'：'+fmtR(p[0].value)},
    grid:{left:10,right:20,top:10,bottom:0,containLabel:true},
    xAxis:{type:'value',axisLabel:{color:sub,formatter:fmt},splitLine:{lineStyle:{color:'#f3f4f6'}}},
    yAxis:{type:'category',data:D.regions.map(r=>r.name).reverse(),axisLine:{show:false},axisTick:{show:false},axisLabel:{color:dark}},
    series:[{type:'bar',barWidth:16,data:D.regions.map(r=>r.gmv).reverse(),
      itemStyle:{borderRadius:[0,8,8,0],color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#3b82f6'},{offset:1,color:'#2563eb'}])}}]
  });
  // TOP10 表
  document.getElementById('top-table').innerHTML =
    '<tr><th>排名</th><th>商品</th><th>GMV</th><th>订单</th><th>退款率</th></tr>' +
    D.top_products.map((p,i)=>`<tr><td><span class="rank r${i+1}">${i+1}</span></td>
      <td>${p.name}<br><span style="font-size:11px;color:#6b7280">${p.category} · 库存${p.stock}</span></td>
      <td style="font-weight:600">${fmtR(p.gmv)}</td><td>${p.orders.toLocaleString()}</td>
      <td style="color:${p.refund>5?'#dc2626':'#6b7280'}">${p.refund}%</td></tr>`).join('');
});

/* ---------------- AI 问答（SSE 流式） ---------------- */
const chatBox = document.getElementById('chat');
const input = document.getElementById('q');
const btn = document.getElementById('send');
let history = [];
let busy = false;

function addMsg(role, text, cls=''){
  const div = document.createElement('div');
  div.className = 'msg ' + role + (cls?' '+cls:'');
  div.innerHTML = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}
function mdLite(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
          .replace(/#{1,4}\s*(.+)/g,'$1');
}

async function ask(text){
  if (busy || !text.trim()) return;
  busy = true; btn.disabled = true;
  addMsg('user', mdLite(text));
  const bot = addMsg('bot', '<span class="typing"><i></i><i></i><i></i></span>');
  history.push({role:'user', content:text});
  try{
    const resp = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text, history:history.slice(-6)})
    });
    if (!resp.ok){
      const e = await resp.json().catch(()=>({error:'服务异常 '+resp.status}));
      throw new Error(e.error || '服务异常');
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', out = '';
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines){
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const payload = t.slice(5).trim();
        if (payload === '[DONE]') continue;
        try{
          const j = JSON.parse(payload);
          if (j.error) throw new Error(j.error);
          if (j.content){ out += j.content; bot.innerHTML = mdLite(out); chatBox.scrollTop = chatBox.scrollHeight; }
        }catch(err){ if (err.message && !/JSON/.test(err.message)) throw err; }
      }
    }
    if (out) history.push({role:'assistant', content:out});
    else if (!bot.querySelector('.typing') === false) bot.innerHTML = '（未获取到回答，请重试）';
  }catch(err){
    bot.className = 'msg bot error';
    bot.textContent = '⚠ ' + err.message;
  }finally{
    busy = false; btn.disabled = false;
  }
}

btn.onclick = () => { const v = input.value; input.value=''; ask(v); };
input.addEventListener('keydown', e => { if (e.key === 'Enter'){ const v = input.value; input.value=''; ask(v); } });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => ask(c.textContent));

addMsg('bot', mdLite('您好！我是本店的 **AI 运营分析师** ✦\n已接入近 30 天全店经营数据，可以问我：销售情况、品类结构、热销商品、转化漏斗、库存与补货、运营建议等。'));
</script>
</body>
</html>
